<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMM navigation study</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#ffffff; --fg:#1d1f22; --muted:#8c9199; --line:#e3e5e8; --hover:#f3f4f6;
    --accent:#653DF4; --accent-fg:#ffffff; --ok:#1f7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:16px 20px 80px}
  .logo{display:block;height:120px;width:auto;margin-bottom:24px}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-bottom:28px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  h1{font-size:24px;line-height:1.25;margin:0 0 12px;font-weight:650}
  h2{font-size:19px;line-height:1.3;margin:0 0 8px;font-weight:600}
  p{margin:0 0 14px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);padding:11px 16px}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  button.primary:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:3px solid #9db3f0;outline-offset:2px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
  .spacer{flex:1}
  .choices{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
  .choice{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .choice:hover{background:var(--hover)}
  .choice input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .choice.sel{border-color:var(--accent)}
  textarea{width:100%;min-height:96px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical}
  .scale{display:flex;gap:8px;margin:14px 0 6px}
  .scale button{flex:1;padding:14px 0;font-weight:600}
  .scale button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .scale-labels{display:flex;justify-content:space-between}
  /* task */
  .task{margin:0 0 18px}
  .task .kicker{font-size:13px;color:var(--muted);margin-bottom:4px}
  .task p{margin:0;font-size:17px;line-height:1.45}
  .task p.prompt{margin-top:8px;font-size:14px;color:var(--muted)}
  .crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:22px;margin-bottom:14px}
  .crumbs a{color:var(--muted);text-decoration:none;border-bottom:1px dotted #b8bcc2;cursor:pointer}
  .crumbs a:hover{color:var(--fg)}
  .crumbs .cur{color:var(--fg);font-weight:600}
  .tree{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .grp{padding:14px 14px 4px;font-size:12.5px;letter-spacing:.02em;color:var(--muted);font-weight:600;border-top:1px solid var(--line)}
  .grp:first-child{border-top:0}
  .node{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
  .grp + .node{border-top:0}
  .node:hover{background:var(--hover)}
  .node.sel{background:#eef2fc}
  .node .chev,.back .chev{width:18px;height:18px;flex:none;color:#7c828c}
  .node:hover .chev{color:var(--fg)}
  .node .leaf{width:18px;height:18px;flex:none;border-radius:4px;border:2px solid #9ca1a9;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff}
  .node .leaf svg{width:12px;height:12px;display:none}
  .node.sel .leaf{border-color:var(--accent);background:var(--accent)}
  .node.sel .leaf svg{display:block}
  .back{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;cursor:pointer;background:#fafbfc}
  .back:hover{color:var(--fg)}
  .back:hover .chev{color:var(--fg)}
  .hint{font-size:14px;color:var(--muted);margin:10px 0 0}
  .done{text-align:center;padding:40px 0}
  .done .mark{width:52px;height:52px;border-radius:50%;background:#e6f4ec;color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
  .err{background:#fff4f0;border:1px solid #f3c7b8;border-radius:8px;padding:12px 14px;font-size:14px;margin-top:14px}
  .err textarea{margin-top:8px;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  @media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.svg" alt="Percona Monitoring and Management">
  <div class="progress"><i id="bar"></i></div>
  <div id="app"></div>
</div>

<script>
/* =========================================================================
   CONFIGURATION — this is the only part you edit
   ========================================================================= */

// 1. Paste the Web app URL you get after deploying the Google Apps Script.
//    Leave empty to run without saving (results shown on screen instead).
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwopnIAoy9e6IQDEGA-j8UMbPchXuhO1MDjVJ0RmaygaGHUejb0LQ_PIdh-G2pi3-O6_A/exec";

// 2. Study settings
const STUDY = {
  id: "pmm-wayfinding-v1",       // change when you change tree or tasks
  randomizeTasks: true,
  passMarks: { success: 0.70, direct: 0.50 } // informational, used in analysis
};

// 3. The tree. Root groups (TECHNOLOGIES, …) are non-clickable headings.
//    Anything with `children` can be opened; anything without is a leaf.
//    Every node gets an id automatically from its label path, e.g. "MySQL > Add service".
const TREE = [
  { label: "Home page" },
  { group: "My navigation", children: [
    { label: "MongoDB backups" },
    { label: "MySQL InnoDB details" },
    { label: "PostgreSQL query analytics" }
  ]},
  { group: "Technologies", children: [
    { label: "MongoDB hub page" },
    { label: "MySQL hub page" },
    { label: "PostgreSQL hub page" },
    { label: "Valkey hub page" },
    { label: "Operating system" }
  ]},
  { group: "Analysis & alerting", children: [
    { label: "Advisors" },
    { label: "Alerts", children: [
      { label: "Status" }, { label: "Alert rules" }, { label: "Templates" }, { label: "Contact points" }, { label: "Notification policies" }, { label: "Silences" }, { label: "Alert groups" }, { label: "Alert settings" } ]},
    { label: "Explore data" },
    { label: "Query analytics" }
  ]},
  { group: "Browse", children: [
    { label: "All dashboards" },
    { label: "Apps", children: [
      { label: "Data archiving" }, { label: "MongoDB backups" }, { label: "MySQL backups" }, { label: "PostgreSQL backups" }, { label: "ProxySQL manager" }, { label: "Replication checksums" }, { label: "Schema changes" }, { label: "Support diagnostics" }, { label: "Valkey backups" }, { label: "Get more apps" } ]},
    { label: "Inventory", children: [ { label: "Services" }, { label: "Nodes" } ]}
  ]},
  { group: "Administration", children: [
    { label: "PMM HA" },
    { label: "Configuration", children: [
      { label: "Settings" }, { label: "Updates" },
      { label: "Org. management", children: [ { label: "Organizations" }, { label: "Stats and licenses" }, { label: "Default preferences" } ] } ]},
    { label: "Users and access", children: [
      { label: "Users" }, { label: "Teams" }, { label: "Services accounts" }, { label: "Access roles" } ]},
    { label: "Account", children: [
      { label: "Profile" }, { label: "Notification history" }, { label: "Change password" } ]},
    { label: "Help" }
  ]}
];

// 4. Tasks. `correct` lists accepted destinations, written as label paths with " > ".
//    A destination matches if the participant's chosen node path equals it,
//    or (for a parent) if their choice is that node or anything inside it when `deep: true`.
const TASKS = [
  { id: "T1", text: "One of your MongoDB clusters is copied to safe storage every night. Check whether last night's copy finished without errors.",
    correct: ["MongoDB backups", "MongoDB hub page", "Apps > MongoDB backups", "Home page"] },
  { id: "T2", text: "Users say a PostgreSQL database got slow this morning. Find where you'd see which SQL statements are taking the longest to run.",
    correct: ["PostgreSQL query analytics", "PostgreSQL hub page", "Query analytics"] },
  { id: "T3", text: "You've just set up a new MySQL server. Where would you go so PMM starts monitoring it?",
    correct: ["MySQL hub page", "Inventory > Services"] },
  { id: "T4", text: "You've just been paged/notified. Find the quickest place to see which of your databases currently have a problem.",
    correct: ["Home page", "Alerts > Status"] },
  { id: "T5", text: "You want to be told when replication lag on a MongoDB cluster goes above a threshold. Where would you set that up?",
    correct: ["Alerts > Alert rules", "Alerts > Templates", "MongoDB hub page"] },
  { id: "T6", text: "Percona Support asked you to send a diagnostics bundle from your PMM server. Where would you get it?",
    correct: ["Apps > Support diagnostics"] }
  // Optional muscle-memory probe — uncomment to include:
  // ,{ id: "T7", text: "Find the list of configuration and security recommendations PMM has generated for your databases.",
  //   correct: ["Advisors"], deep: true }
];

// 5. Questions before and after. Edit copy freely.
const PRE = [
  { id: "role", type: "single", q: "Which best describes your role?",
    options: ["DBA / database engineer","SRE / DevOps / platform engineer","Software developer"], other: true },
  { id: "versions", type: "multi", q: "Which PMM versions have you used?",
    options: ["PMM 2","PMM 3"], optOut: "I haven't used PMM" }
];
const POST = [
  { id: "ease", type: "scale", q: "Overall, how easy was it to find things in this menu?", low: "Very hard", high: "Very easy" },
  { id: "hub_expect", type: "single", q: "If you clicked \"MySQL hub page\" in a database monitoring tool, what would you expect to see?",
    options: ["A list of dashboards to choose from","A summary page: health, your clusters, and links to apps, tools and actions","The main MySQL dashboard straight away"], other: true },
  { id: "hardest", type: "text", q: "Which task was hardest, and what did you expect to click instead?", optional: true }
];

const COPY = {
  welcomeTitle: "Help us make PMM easier to navigate",
  welcome: "This takes about 5 minutes. You'll see a text-only version of PMM's (Percona Monitoring and Management) main menu, the sidebar you use to move around between pages. We'll give you a few tasks and ask you to click through and select a page. There are no wrong answers.",
  welcome2: "Your answers are anonymous unless you choose to get in touch at the end.",
  start: "Start",
  taskIntro: "Each task describes something you need to do. Click through the menu the way you would in the real PMM sidebar. When you see the item you believe opens the page you need, select it and click \"I'd find it here\". Go with your instinct.",
  taskPrompt: "Where in the menu would you click to reach this?",
  thanksTitle: "Thanks. That helps a lot.",
  thanks: "Your answers feed directly into how PMM's navigation will work in the next major release.",
  thanks2: "Open to a 20-minute follow-up call about how you use PMM? Reply where you found this link or email pedro.fernandes@percona.com.",
  already: "You've already taken part in this study from this browser. Thank you!"
};

/* =========================================================================
   ENGINE — you shouldn't need to edit below
   ========================================================================= */

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const src = new URLSearchParams(location.search).get("src") || "direct";
const doneKey = "tt_done_" + STUDY.id;
// Open the page with ?reset to forget a previous completion in this browser (handy while testing).
if (new URLSearchParams(location.search).has("reset")){ localStorage.removeItem(doneKey); history.replaceState(null, "", location.pathname); }

// Build lookup: node -> path id, parent, children
const byPath = new Map();
function index(nodes, prefix, parent){
  nodes.forEach(n => {
    if (n.group){ index(n.children, prefix, parent); return; }
    n.path = prefix ? prefix + " > " + n.label : n.label;
    n.parent = parent; byPath.set(n.path, n);
    if (n.children) index(n.children, n.path, n);
  });
}
index(TREE, "", null);

const state = {
  participant: Math.random().toString(36).slice(2,10) + Date.now().toString(36),
  startedAt: new Date().toISOString(),
  pre: {}, post: {}, tasks: [],
  order: TASKS.map((_,i)=>i)
};
if (STUDY.randomizeTasks) state.order.sort(()=>Math.random()-.5);

const steps = [];
steps.push(renderWelcome);
PRE.forEach(q => steps.push(() => renderQuestion(q, state.pre)));
steps.push(renderTaskIntro);
const taskSteps = new Set();
state.order.forEach((ti, n) => { taskSteps.add(steps.length); steps.push(() => renderTask(TASKS[ti], n)); });
POST.forEach(q => steps.push(() => renderQuestion(q, state.post)));
steps.push(renderSubmit);
let step = 0;

function go(){ bar.style.width = Math.round(step/(steps.length-1)*100) + "%"; app.innerHTML=""; steps[step](); window.scrollTo(0,0); }
function next(){ step++; go(); }
// Going back is allowed everywhere except into a finished task (its timing and path are already recorded).
function canGoBack(){ return step > 0 && !taskSteps.has(step-1); }
function back(){ if (canGoBack()){ step--; go(); } }
function backButton(){ const b = el(`<button type="button" id="back">‹ Back</button>`); b.onclick = back; return b; }
const ICON = {
  right: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  left:  '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderWelcome(){
  if (localStorage.getItem(doneKey)){
    app.appendChild(el(`<div class="done"><div class="mark">✓</div><h1>${esc(COPY.thanksTitle)}</h1><p class="muted">${esc(COPY.already)}</p></div>`)); return;
  }
  app.appendChild(el(`<div>
    <h1>${esc(COPY.welcomeTitle)}</h1>
    <p>${esc(COPY.welcome)}</p>
    <p class="muted">${esc(COPY.welcome2)}</p>
    <div class="actions"><button class="primary" id="go">${esc(COPY.start)}</button></div>
  </div>`));
  document.getElementById("go").onclick = next;
}

function renderQuestion(q, store){
  const box = el(`<div><h2>${esc(q.q)}</h2></div>`);
  const saved = store[q.id];
  let value = saved !== undefined ? (Array.isArray(saved) ? saved.slice() : saved) : (q.type === "multi" ? [] : null);
  let otherText = store[q.id + "_other"] || "";
  const btn = el(`<button class="primary" disabled>Continue</button>`);
  const check = () => { btn.disabled = !(q.optional || (Array.isArray(value) ? value.length : value !== null) ); };

  if (q.type === "single" || q.type === "multi"){
    const list = el(`<div class="choices"></div>`);
    const opts = q.options.slice();
    if (q.other) opts.push("Other");
    if (q.optOut) opts.push(q.optOut);
    opts.forEach(o => {
      const isOther = q.other && o === "Other";
      const isOptOut = q.optOut && o === q.optOut;
      const row = el(`<label class="choice"><input type="${q.type==="multi"?"checkbox":"radio"}" name="${q.id}"><span>${esc(o)}</span></label>`);
      const input = row.querySelector("input");
      input.checked = q.type === "multi" ? value.includes(o) : value === o;
      row.classList.toggle("sel", input.checked);
      input.onchange = () => {
        if (q.type === "multi"){
          if (isOptOut && input.checked){ value = [o]; list.querySelectorAll("input").forEach(i=>{ if(i!==input) i.checked=false; }); }
          else { value = value.filter(v => v !== q.optOut); if (input.checked) value.push(o); else value = value.filter(v=>v!==o);
                 list.querySelectorAll("input").forEach(i=>{ if(i.nextSibling.textContent===q.optOut) i.checked=false; }); }
        } else value = o;
        list.querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel", c.querySelector("input").checked));
        otherBox.style.display = (q.type === "multi" ? value.includes("Other") : value === "Other") ? "block" : "none";
        check();
      };
      list.appendChild(row);
    });
    const otherBox = el(`<div style="display:none;margin-top:6px"><textarea placeholder="Tell us more (optional)" style="min-height:60px"></textarea></div>`);
    otherBox.querySelector("textarea").value = otherText;
    otherBox.querySelector("textarea").oninput = e => otherText = e.target.value;
    otherBox.style.display = (q.type === "multi" ? value.includes("Other") : value === "Other") ? "block" : "none";
    box.appendChild(list); box.appendChild(otherBox);
  }
  if (q.type === "scale"){
    const s = el(`<div class="scale"></div>`);
    for (let i=1;i<=5;i++){ const b = el(`<button type="button">${i}</button>`); if (value === i) b.classList.add("sel"); b.onclick=()=>{ value=i; s.querySelectorAll("button").forEach(x=>x.classList.toggle("sel", x===b)); check(); }; s.appendChild(b); }
    box.appendChild(s);
    box.appendChild(el(`<div class="scale-labels small muted"><span>${esc(q.low)}</span><span>${esc(q.high)}</span></div>`));
  }
  if (q.type === "text"){
    const t = el(`<textarea placeholder="${q.optional ? "Optional, one line is plenty" : ""}"></textarea>`);
    if (value) t.value = value;
    t.oninput = e => { value = e.target.value.trim() || null; check(); };
    box.appendChild(t);
  }
  check();
  btn.onclick = () => { store[q.id] = value; if (otherText) store[q.id + "_other"] = otherText; else delete store[q.id + "_other"]; next(); };
  const actions = el(`<div class="actions"></div>`);
  if (canGoBack()){ actions.appendChild(backButton()); actions.appendChild(el(`<span class="spacer"></span>`)); }
  actions.appendChild(btn); box.appendChild(actions); app.appendChild(box);
}

function renderTaskIntro(){
  app.appendChild(el(`<div><h2>How the test works</h2><p>${esc(COPY.taskIntro)}</p>
    <p class="muted small">${TASKS.length} tasks to complete.</p>
    <div class="actions" id="actions"><span class="spacer"></span><button class="primary" id="go">Begin test</button></div></div>`));
  if (canGoBack()) document.getElementById("actions").prepend(backButton());
  document.getElementById("go").onclick = next;
}

function renderTask(task, n){
  const rec = { id: task.id, order: n+1, path: [], backs: 0, started: Date.now(), destination: null, outcome: null, ms: 0 };
  let current = null;   // node object or null for root
  let selected = null;  // leaf node awaiting confirm

  const box = el(`<div>
    <div class="task"><div class="kicker">Task ${n+1} of ${TASKS.length}</div><p>${esc(task.text)}</p><p class="prompt">${esc(COPY.taskPrompt)}</p></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="tree" id="tree"></div>
    <div class="actions" id="actions">
      <span class="spacer"></span>
      <button id="skip">Not sure where I'd go</button>
      <button class="primary" id="here" disabled>I'd find it here</button>
    </div>
  </div>`);
  app.appendChild(box);
  const treeEl = box.querySelector("#tree"), crumbs = box.querySelector("#crumbs"), here = box.querySelector("#here");

  function draw(){
    treeEl.innerHTML = ""; crumbs.innerHTML = "";
    // breadcrumbs
    const chain = []; let c = current; while (c){ chain.unshift(c); c = c.parent; }
    const root = chain.length ? el(`<a>Main menu</a>`) : el(`<span class="cur">Main menu</span>`);
    if (chain.length) root.onclick = () => jump(null);
    crumbs.appendChild(root);
    chain.forEach((nd, i) => {
      crumbs.appendChild(el(`<span>›</span>`));
      const a = i === chain.length-1 ? el(`<span class="cur">${esc(nd.label)}</span>`) : el(`<a>${esc(nd.label)}</a>`);
      if (i !== chain.length-1) a.onclick = () => jump(nd);
      crumbs.appendChild(a);
    });
    // nodes
    const items = current ? current.children : TREE;
    items.forEach(it => {
      if (it.group){ treeEl.appendChild(el(`<div class="grp">${esc(it.group)}</div>`)); it.children.forEach(drawNode); }
      else drawNode(it);
    });
    if (current){
      const b = el(`<div class="back">${ICON.left}<span>Back to ${esc(current.parent ? current.parent.label : "main menu")}</span></div>`);
      b.onclick = () => { rec.backs++; rec.path.push("<back>"); current = current.parent; selected = null; here.disabled = true; draw(); };
      treeEl.appendChild(b);
    }
    // a non-leaf you're standing in can also be chosen
    here.disabled = !(selected || current);
  }
  function drawNode(nd){
    const row = el(`<div class="node"><span>${esc(nd.label)}</span>${nd.children ? ICON.right : '<span class="leaf">' + ICON.check + '</span>'}</div>`);
    if (selected === nd) row.classList.add("sel");
    row.onclick = () => {
      if (nd.children){ rec.path.push(nd.path); current = nd; selected = null; draw(); }
      else { rec.path.push(nd.path); selected = nd; treeEl.querySelectorAll(".node").forEach(r=>r.classList.remove("sel")); row.classList.add("sel"); here.disabled = false; }
    };
    treeEl.appendChild(row);
  }
  function jump(nd){ rec.backs++; rec.path.push("<back>"); current = nd; selected = null; draw(); }

  function finish(dest){
    rec.ms = Date.now() - rec.started;
    rec.destination = dest ? dest.path : null;
    if (!dest) rec.outcome = "skipped";
    else {
      const ok = task.correct.some(c => dest.path === c || (task.deep && dest.path.startsWith(c + " > ")));
      rec.outcome = ok ? (rec.backs === 0 ? "direct" : "indirect") : (rec.backs === 0 ? "direct-fail" : "indirect-fail");
    }
    state.tasks.push(rec); next();
  }
  here.onclick = () => finish(selected || current);
  box.querySelector("#skip").onclick = () => finish(null);
  draw();
}

function renderSubmit(){
  const payload = {
    study: STUDY.id, participant: state.participant, src, startedAt: state.startedAt,
    finishedAt: new Date().toISOString(), ua: navigator.userAgent.slice(0,120),
    pre: state.pre, post: state.post, tasks: state.tasks
  };
  const box = el(`<div class="done"><div class="mark">✓</div><h1>${esc(COPY.thanksTitle)}</h1>
    <p>${esc(COPY.thanks)}</p><p class="muted small">${esc(COPY.thanks2)}</p><p class="muted small" id="status">Saving…</p></div>`);
  app.appendChild(box);
  const status = box.querySelector("#status");
  localStorage.setItem(doneKey, "1");
  if (!ENDPOINT){
    status.textContent = "No endpoint configured. Results below (test mode).";
    box.appendChild(el(`<div class="err" style="text-align:left"><b>Test mode</b><textarea readonly>${esc(JSON.stringify(payload,null,2))}</textarea></div>`));
    return;
  }
  fetch(ENDPOINT, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(payload) })
    .then(()=>{ status.textContent = "Saved."; })
    .catch(()=>{
      status.textContent = "";
      box.appendChild(el(`<div class="err" style="text-align:left">Couldn't reach the server. Please copy the text below and send it to the person who shared this link.<textarea readonly>${esc(JSON.stringify(payload))}</textarea></div>`));
    });
}

go();
</script>
</body>
</html>
